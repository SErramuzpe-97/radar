openapi: 3.1.0
info:
  title: Radar API
  description: API local de Radar (binario Rust en 127.0.0.1). La app web (Preact+TS) consume esta API a través del cliente generado desde este contrato OAS (api/openapi.yaml). Las búsquedas (scan/audit/watch) se ejecutan desde la web vía /api/jobs/*.
  license:
    name: MIT
    identifier: MIT
  version: 0.1.0
paths:
  /api/auditorias-tecnicas/{id}/archivo/{kind}:
    get:
      tags:
      - negocios
      operationId: download
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Informe original
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Original caducado o no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/auditorias-tecnicas/{id}/archivo/{kind}/preview:
    get:
      tags:
      - negocios
      operationId: preview
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: kind
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Vista previa aislada del informe HTML original
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeOk'
  /api/auth/me:
    get:
      tags:
      - auth
      operationId: me
      responses:
        '200':
          description: Sesión actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          description: No autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/auth/request-code:
    post:
      tags:
      - auth
      operationId: request_code
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
        required: true
      responses:
        '200':
          description: Si el email está autorizado se envía un código (no se revela la allowlist)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeOk'
        '429':
          description: Demasiados intentos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/auth/verify:
    post:
      tags:
      - auth
      operationId: verify
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthVerify'
        required: true
      responses:
        '200':
          description: Sesión creada (cookie radar_session HttpOnly)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          description: Código incorrecto o caducado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/clasificacion:
    get:
      tags:
      - fuentes
      operationId: clasificacion
      responses:
        '200':
          description: Resultado del filtro comercial por evidencias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenClasificacion'
  /api/cobertura:
    get:
      tags:
      - stats
      operationId: cobertura
      responses:
        '200':
          description: Cobertura de registros conocidos por municipio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoberturaMunicipio'
  /api/duplicados:
    get:
      tags:
      - negocios
      operationId: list_duplicados
      responses:
        '200':
          description: Posibles duplicados pendientes de revisión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidatoDuplicado'
  /api/duplicados/{id}:
    delete:
      tags:
      - negocios
      operationId: descartar_duplicado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Sugerencia descartada
        '404':
          description: No encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/duplicados/{id}/fusionar:
    post:
      tags:
      - negocios
      operationId: fusionar_duplicado
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FusionDuplicado'
        required: true
      responses:
        '200':
          description: Fichas fusionadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeOk'
  /api/export:
    get:
      tags:
      - export
      operationId: export
      parameters:
      - name: formato
        in: query
        required: false
        schema:
          type: string
      - name: prioridad
        in: query
        required: false
        schema:
          type: string
      - name: municipio
        in: query
        required: false
        schema:
          type: string
      - name: sector
        in: query
        required: false
        schema:
          type: string
      - name: rubro
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Export (csv / geojson / gpx) según `formato`
          content:
            text/csv:
              schema:
                type: string
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/fuentes:
    get:
      tags:
      - fuentes
      operationId: list_fuentes
      responses:
        '200':
          description: Fuentes configuradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fuente'
    post:
      tags:
      - fuentes
      operationId: create_fuente
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaFuente'
        required: true
      responses:
        '201':
          description: Fuente creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fuente'
  /api/fuentes/candidatas:
    get:
      tags:
      - fuentes
      operationId: list_fuentes_candidatas
      responses:
        '200':
          description: Dominios candidatos descubiertos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuenteCandidata'
  /api/fuentes/candidatas/{id}:
    patch:
      tags:
      - fuentes
      operationId: update_fuente_candidata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoCandidataRequest'
        required: true
      responses:
        '200':
          description: Candidata actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeOk'
  /api/fuentes/{id}:
    patch:
      tags:
      - fuentes
      operationId: update_fuente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarFuenteRequest'
        required: true
      responses:
        '200':
          description: Fuente actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fuente'
        '404':
          description: Fuente no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/jobs:
    get:
      tags:
      - jobs
      operationId: list_jobs
      responses:
        '200':
          description: Últimos jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Job'
  /api/jobs/audit:
    post:
      tags:
      - jobs
      operationId: lanzar_audit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditParams'
        required: true
      responses:
        '202':
          description: Auditoría lanzada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/jobs/crawl:
    post:
      tags:
      - jobs
      operationId: lanzar_crawl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrawlParams'
        required: true
      responses:
        '202':
          description: Rastreo lanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/jobs/discovery:
    post:
      tags:
      - jobs
      operationId: bulk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusquedaWebParams'
        required: true
      responses:
        '202':
          description: Descubrimiento reanudable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/jobs/scan:
    post:
      tags:
      - jobs
      operationId: lanzar_scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanParams'
        required: true
      responses:
        '202':
          description: Scan lanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/jobs/watch:
    post:
      tags:
      - jobs
      operationId: lanzar_watch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchParams'
        required: true
      responses:
        '202':
          description: Watch lanzado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '500':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/jobs/{id}:
    get:
      tags:
      - jobs
      operationId: get_job
      parameters:
      - name: id
        in: path
        description: ID del job
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Estado del job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/jobs/{id}/retry:
    post:
      tags:
      - jobs
      operationId: retry_job
      parameters:
      - name: id
        in: path
        description: ID del job
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Job reintentado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          description: Job no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
        '409':
          description: Hay otro job activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios:
    get:
      tags:
      - negocios
      operationId: list_negocios
      parameters:
      - name: municipio
        in: query
        required: false
        schema:
          type: string
      - name: sector
        in: query
        required: false
        schema:
          type: string
      - name: rubro
        in: query
        required: false
        schema:
          type: string
      - name: tipo_entidad
        in: query
        required: false
        schema:
          type: string
      - name: estado_web
        in: query
        required: false
        schema:
          type: string
      - name: estado_auditoria_tecnica
        in: query
        required: false
        schema:
          type: string
      - name: estado_pipeline
        in: query
        required: false
        schema:
          type: string
      - name: prioridad
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        schema:
          type: string
      - name: dir
        in: query
        required: false
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: tam
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: mostrar_descartados
        in: query
        required: false
        schema:
          type: boolean
      - name: sur
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: oeste
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: norte
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: este
        in: query
        required: false
        schema:
          type: number
          format: double
      responses:
        '200':
          description: Página de negocios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaNegocios'
        '500':
          description: Error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/descartados:
    patch:
      tags:
      - negocios
      operationId: set_descartados
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarDescartados'
        required: true
      responses:
        '200':
          description: Negocios archivados o restaurados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDescartados'
  /api/negocios/mapa:
    get:
      tags:
      - negocios
      operationId: list_negocios_mapa
      parameters:
      - name: municipio
        in: query
        required: false
        schema:
          type: string
      - name: sector
        in: query
        required: false
        schema:
          type: string
      - name: rubro
        in: query
        required: false
        schema:
          type: string
      - name: tipo_entidad
        in: query
        required: false
        schema:
          type: string
      - name: estado_web
        in: query
        required: false
        schema:
          type: string
      - name: estado_auditoria_tecnica
        in: query
        required: false
        schema:
          type: string
      - name: estado_pipeline
        in: query
        required: false
        schema:
          type: string
      - name: prioridad
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: ordenar
        in: query
        required: false
        schema:
          type: string
      - name: dir
        in: query
        required: false
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: tam
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: mostrar_descartados
        in: query
        required: false
        schema:
          type: boolean
      - name: sur
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: oeste
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: norte
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: este
        in: query
        required: false
        schema:
          type: number
          format: double
      - name: zoom
        in: query
        description: Nivel de zoom de Leaflet (0–19). La respuesta contiene como máximo 825 elementos.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: Zona visible agrupada, hasta 825 elementos sin truncar empresas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaMapa'
        '400':
          description: Zona inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}:
    get:
      tags:
      - negocios
      operationId: get_negocio
      parameters:
      - name: id
        in: path
        description: ID del negocio
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Detalle del negocio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NegocioDetalle'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/auditoria-tecnica:
    get:
      tags:
      - negocios
      operationId: report
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Informes por motor y dispositivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoAuditoriaTecnica'
    post:
      tags:
      - jobs
      operationId: launch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          description: Auditoría técnica programada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Confirma primero una URL propia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/auditoria-tecnica/revisiones:
    get:
      tags:
      - negocios
      operationId: reviews
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Revisiones humanas persistidas de los hallazgos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RevisionHallazgo'
    put:
      tags:
      - negocios
      operationId: save_review
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarRevisionHallazgo'
        required: true
      responses:
        '200':
          description: Estado de revisión guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionHallazgo'
        '400':
          description: Revisión no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/borradores:
    get:
      tags:
      - crm
      operationId: list_borradores
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Borradores guardados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BorradorContacto'
    post:
      tags:
      - crm
      operationId: create_borrador
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoBorrador'
        required: true
      responses:
        '201':
          description: Borrador guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorradorContacto'
  /api/negocios/{id}/diagnostico-visita:
    get:
      tags:
      - negocios
      operationId: visit_state
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Biblioteca de capturas y selección para una visita
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDiagnosticoVisita'
        '404':
          description: Negocio no encontrado
    put:
      tags:
      - negocios
      operationId: save_visit_state
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardarDiagnosticoVisita'
        required: true
      responses:
        '200':
          description: Selección y notas guardadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDiagnosticoVisita'
        '400':
          description: Captura o estado no válido
  /api/negocios/{id}/eventos:
    get:
      tags:
      - negocios
      operationId: list_eventos
      parameters:
      - name: id
        in: path
        description: ID del negocio
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Eventos del negocio
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evento'
    post:
      tags:
      - negocios
      operationId: add_evento
      parameters:
      - name: id
        in: path
        description: ID del negocio
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoEvento'
        required: true
      responses:
        '201':
          description: Evento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evento'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/oportunidades/{servicio}:
    patch:
      tags:
      - negocios
      operationId: set_oportunidad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: servicio
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOportunidadRequest'
        required: true
      responses:
        '200':
          description: Estado de oportunidad actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OportunidadServicio'
        '404':
          description: Negocio u oportunidad no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/pipeline:
    patch:
      tags:
      - negocios
      operationId: set_pipeline
      parameters:
      - name: id
        in: path
        description: ID del negocio
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPipelineRequest'
        required: true
      responses:
        '200':
          description: Pipeline actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pipeline'
        '404':
          description: No existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/web:
    get:
      tags:
      - negocios
      operationId: info
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Web confirmada, candidatas y búsqueda disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebInfo'
    patch:
      tags:
      - negocios
      operationId: confirm
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmarWeb'
        required: true
      responses:
        '200':
          description: Web confirmada; auditoría programada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebInfo'
        '400':
          description: URL no válida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorApi'
  /api/negocios/{id}/web/candidatas/{candidate}:
    delete:
      tags:
      - negocios
      operationId: discard
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: candidate
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: Sugerencia descartada
  /api/negocios/{id}/web/descubrir:
    post:
      tags:
      - jobs
      operationId: discover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '202':
          description: Búsqueda de web programada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /api/plantillas:
    get:
      tags:
      - crm
      operationId: list_plantillas
      responses:
        '200':
          description: Plantillas de contacto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlantillaContacto'
    post:
      tags:
      - crm
      operationId: create_plantilla
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevaPlantillaContacto'
        required: true
      responses:
        '201':
          description: Plantilla creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlantillaContacto'
  /api/stats:
    get:
      tags:
      - stats
      operationId: stats
      responses:
        '200':
          description: KPIs del panel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /api/tareas:
    get:
      tags:
      - crm
      operationId: list_tareas
      parameters:
      - name: desde
        in: query
        required: false
        schema:
          type: string
      - name: hasta
        in: query
        required: false
        schema:
          type: string
      - name: prioridad
        in: query
        required: false
        schema:
          type: string
      - name: servicio
        in: query
        required: false
        schema:
          type: string
      - name: estado
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Seguimientos pendientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TareaSeguimiento'
