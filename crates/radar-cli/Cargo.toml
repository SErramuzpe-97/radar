[package]
name = "radar-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Binario radar: CLI (scan/audit/export/watch) + API REST (axum+utoipa) + dashboard embebido"

[dependencies]
radar-core = { path = "../radar-core" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
rust-embed = { version = "8", features = ["debug-embed"] }
mime_guess = "2"
utoipa = "5"
uuid = { version = "1", features = ["v4"] }
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
